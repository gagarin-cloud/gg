# Publishes binaries and checksums when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds a changelog from history, which a shallow clone lacks.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed to push the cask update to gagarin-cloud/homebrew-tap;
          # GITHUB_TOKEN above can't write outside this repo. The same is true
          # of the Scoop bucket and of our winget-pkgs fork, so each gets its
          # own token rather than one key to three repositories.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          # Must also be able to open a pull request on microsoft/winget-pkgs,
          # which a fine-grained token scoped to our fork alone cannot do.
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
