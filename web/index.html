<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gagarin — status</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171b22; --panel2:#1e232c; --line:#2b323d;
    --text:#e6e9ef; --dim:#8b93a3;
    --ok:#3ecf8e; --warn:#e8b84b; --bad:#e5484d; --link:#5b9dff;
  }
  :root[data-theme="light"], html:not([data-theme="dark"]) {}
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f6; --line:#dfe3ea;
      --text:#161a21; --dim:#69707e;
      --ok:#0f9d58; --warn:#b7791f; --bad:#c62b30; --link:#2563eb;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text); overflow:hidden;
    font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header {
    display:flex; align-items:center; gap:14px; padding:14px 20px;
    border-bottom:1px solid var(--line); background:var(--panel);
    position:relative; z-index:3;
  }
  h1 { font-size:16px; margin:0; font-weight:650; letter-spacing:-0.01em; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .id { color:var(--dim); font-size:12px; }
  .spacer { margin-left:auto; }
  .live { color:var(--dim); font-size:12px; display:flex; align-items:center; gap:7px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); transition:background .2s; }
  .dot.err { background:var(--bad); }
  button {
    font:inherit; font-size:12px; color:var(--dim); background:var(--panel2);
    border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer;
  }
  button:hover { color:var(--text); }
  #cy { position:absolute; inset:53px 0 0 0; }
  #err {
    display:none; position:absolute; top:69px; left:50%; transform:translateX(-50%);
    z-index:4; padding:10px 14px; border-radius:8px; max-width:80vw;
    border:1px solid var(--bad); color:var(--bad); background:var(--panel);
  }
  #empty {
    display:none; position:absolute; inset:53px 0 0 0; z-index:2;
    align-items:center; justify-content:center; color:var(--dim); text-align:center;
  }
  /* Bottom-left key. Absolute so it floats over the canvas rather than stealing
     height from it — the graph is the thing here. */
  .legend {
    position:absolute; left:20px; bottom:16px; z-index:3; display:flex; gap:16px;
    flex-wrap:wrap; align-items:center; font-size:12px; color:var(--dim);
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:blur(6px); padding:8px 12px; border-radius:8px; border:1px solid var(--line);
  }
  .legend i { width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:6px; }
  /* One line at any sane window width. It was three ragged right-aligned lines
     with "hangs." orphaned on the last one, which read as a layout fault and
     drew the eye for the wrong reason. balance keeps it even if it ever does
     wrap, and it hides rather than pile up on a narrow window. */
  .hint { position:absolute; right:20px; bottom:16px; z-index:3;
    font-size:12px; color:var(--dim); text-align:right; text-wrap:balance; }
  @media (max-width: 900px) { .hint { display:none; } }
  /* Cytoscape draws to canvas, so the hover card is ordinary DOM positioned over it. */
  #tip {
    display:none; position:absolute; z-index:5; pointer-events:none;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; font-size:12px; box-shadow:0 8px 28px rgba(0,0,0,.28);
    max-width:340px;
  }
  #tip b { font-weight:650; }
  #tip .row { color:var(--dim); margin-top:3px; }
  #tip .row span { color:var(--text); }
  /* A container runtime error runs to several hundred characters and repeats the
     image reference three times, which turned the card into a wall and buried
     the rows above it. Three lines is enough to recognise the failure; the whole
     message is in `gg status`, where it can be read and copied. */
  #tip .row.clamp span {
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:1px;
  }
</style>
</head>
<body>
<header>
  <h1 id="proj">loading…</h1>
  <span class="id mono" id="pid"></span>
  <span class="spacer"></span>
  <button id="fit">fit</button>
  <span class="live"><span class="dot" id="dot"></span><span id="livetxt">live</span></span>
</header>

<div id="err"></div>
<div id="empty"></div>
<div id="cy"></div>
<div id="tip"></div>

<div class="legend" id="legend"></div>
<div class="hint">A missing arrow does not refuse the call — it hangs.</div>

<script src="cytoscape.min.js"></script>
<script src="dagre.min.js"></script>
<script src="cytoscape-dagre.js"></script>
<script src="app.js"></script>
</body>
</html>
